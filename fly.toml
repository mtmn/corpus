primary_region = "fra"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  DATABASE_PATH = "/data"
  CORPUS_USERS_FILE = "/data/users.json"
  METRICS_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "corpus_data"
  destination = "/data"
  initial_size = "1gb"

[metrics]
  port = 8000
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
