image: archlinux
packages:
  - nodejs
  - pnpm
  - duckdb
sources:
  - https://git.sr.ht/~mtmn/corpus
environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"
tasks:
  - setup-purescript: |
      cd corpus
      pnpm install purescript
      pnpm install spago
  - setup-elm: |
      curl -L -o /tmp/elm.gz https://github.com/elm/compiler/releases/download/0.19.2/elm-0.19.2-linux-x64.gz
      echo "66320d27701654fa11bd0e8d84bdf9829694d5770c8dcee2dede6160fad58737  /tmp/elm.gz" | sha256sum -c -
      mkdir -p /home/build/bin
      gzip --decompress /tmp/elm.gz && mv /tmp/elm /home/build/bin
      chmod +x /home/build/bin/elm
  - build: |
      export PATH="$PATH:/home/build/bin"
      cd corpus
      pnpm install
      pnpm run build
  - test: |
      export PATH="$PATH:/home/build/bin"
      cd corpus
      pnpm test
